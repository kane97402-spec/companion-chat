<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111116">
<title>Companion — Character Chat</title>
<style>
:root{color-scheme:dark;--bg:#111116;--panel:#191920;--panel2:#22222b;--line:#30303b;--text:#f4f2f8;--muted:#a5a1b1;--accent:#b49aff;--accent2:#8e76dc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#29213c 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:940px;margin:0 auto;min-height:100vh;padding:22px 22px 18px;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 20px;border-bottom:1px solid #ffffff12}.brand{font-weight:750;letter-spacing:.02em;font-size:17px}.brand span{color:var(--accent)}.top-actions{display:flex;align-items:center;gap:9px}.subtle{color:var(--muted);font-size:12px}.character-button,.mode-button,.icon-button{border:1px solid var(--line);background:#1b1a23;border-radius:999px;padding:8px 13px;display:flex;align-items:center;gap:9px}.character-button:hover,.mode-button:hover,.icon-button:hover{border-color:#7865a8}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#383244}.chat{flex:1;display:flex;flex-direction:column;min-height:0}.welcome{margin:auto auto 24px;text-align:center;max-width:560px;padding:30px 12px}.hero-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid #6e5b9b;box-shadow:0 0 45px #9a7be833;background:#292432}.welcome h1{font-size:27px;margin:17px 0 6px;letter-spacing:-.04em}.welcome p{color:var(--muted);margin:0}.messages{flex:1;overflow:auto;padding:28px 2px 20px;display:flex;flex-direction:column;gap:17px}.message{max-width:min(78%,650px);padding:13px 16px;border-radius:19px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#6e59a4;color:white;border-bottom-right-radius:6px}.message.bot{align-self:flex-start;background:var(--panel2);border:1px solid #ffffff0b;border-bottom-left-radius:6px}.message .speaker{font-size:11px;color:#c9b9f4;margin-bottom:4px}.composer-wrap{padding-top:12px}.composer{display:flex;align-items:flex-end;gap:10px;background:#1b1a22;border:1px solid #393642;border-radius:22px;padding:10px 11px 10px 17px;box-shadow:0 12px 45px #0003}.composer:focus-within{border-color:#806bb6}.composer textarea{flex:1;resize:none;max-height:140px;min-height:28px;border:0;outline:0;background:transparent;color:var(--text);padding:5px 0}.composer textarea::placeholder{color:#888493}.send{width:38px;height:38px;border:0;border-radius:50%;background:var(--accent);color:#1a1525;font-size:18px;font-weight:800}.send:disabled{opacity:.4;cursor:not-allowed}.footnote{text-align:center;color:#777382;font-size:11px;margin:9px 0 0}.overlay{position:fixed;inset:0;background:#07070bbd;backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.open{display:flex}.modal{width:min(720px,100%);max-height:min(82vh,760px);overflow:hidden;background:#191820;border:1px solid #3a3545;border-radius:24px;box-shadow:0 25px 100px #0009;display:flex;flex-direction:column}.modal-head{padding:21px 22px 13px}.modal-head h2{margin:0 0 4px;font-size:20px}.modal-head p{margin:0;color:var(--muted);font-size:13px}.search{margin:0 22px 13px;border:1px solid var(--line);border-radius:12px;background:#111117;padding:11px 13px;color:white;outline:0}.tabs{display:flex;gap:8px;padding:0 22px 14px}.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 15px;color:var(--muted)}.tab.active{background:#332a47;border-color:#7661a3;color:#fff}.cards{overflow:auto;padding:0 22px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.character-card{border:1px solid #35313e;background:#22212a;border-radius:16px;padding:9px;text-align:left;transition:.16s}.character-card:hover{transform:translateY(-2px);border-color:#947ed0;background:#2a2635}.character-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;background:#37313f}.character-card strong{display:block;font-size:13px;margin:7px 2px 0}.character-card small{color:var(--muted);margin:0 2px}.close{margin-left:auto}.loading{color:var(--muted);font-size:13px;padding:12px 22px}.mode-row{display:flex;gap:7px;align-items:center}.mode-button{font-size:12px;padding:7px 11px;color:var(--muted)}.mode-button.active{color:#e9dfff;border-color:#6f5a9b;background:#292337}
@media(max-width:600px){.app{padding:14px 12px}.topbar{padding-bottom:13px}.brand{font-size:15px}.character-button{padding:6px 9px;font-size:12px}.subtle.desktop{display:none}.welcome h1{font-size:23px}.message{max-width:90%}.mode-row{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">companion<span>.</span></div>
  <div class="top-actions">
    <div class="mode-row"><button class="mode-button active" data-mode="Conversation">Conversation</button><button class="mode-button" data-mode="Study">Study</button><button class="mode-button" data-mode="Entertainment">Fun</button></div>
    <button class="character-button" id="openPicker" aria-label="Choose character"><img class="avatar" id="topAvatar" alt=""><span id="topName">Choose character</span><span>⌄</span></button>
  </div>
</header>
<main class="chat">
  <section class="welcome" id="welcome">
    <img class="hero-avatar" id="heroAvatar" alt="Selected character portrait">
    <h1 id="welcomeTitle">Choose who to talk to</h1>
    <p id="welcomeText">Pick a character to start a brand-new conversation.</p>
  </section>
  <section class="messages" id="messages" hidden aria-live="polite"></section>
  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <textarea id="messageInput" rows="1" placeholder="Choose a character to begin..." aria-label="Message" disabled></textarea>
      <button class="send" id="sendButton" type="submit" disabled aria-label="Send message">↑</button>
    </form>
    <p class="footnote">A personal character-chat prototype · Your chats stay in this browser</p>
  </div>
</main>
</div>
<div class="overlay" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
 <div class="modal">
  <div class="modal-head" style="display:flex;align-items:center;gap:12px"><div><h2 id="pickerTitle">Who would you like to talk to?</h2><p>Every selection starts a separate new chat.</p></div><button class="icon-button close" id="closePicker" aria-label="Close">✕</button></div>
  <input class="search" id="search" placeholder="Search characters..." autocomplete="off">
  <div class="tabs"><button class="tab active" data-group="All">All</button><button class="tab" data-group="Girls">Girls</button><button class="tab" data-group="Boys">Boys</button></div>
  <div class="loading" id="loading">Loading character portraits…</div>
  <div class="cards" id="cards"></div>
 </div>
</div>
<script>
const characters=[
{name:"Mai Sakurajima",group:"Girls",anime:"Rascal Does Not Dream",query:"Mai Sakurajima"},
{name:"Ichika Nakano",group:"Girls",anime:"The Quintessential Quintuplets",query:"Ichika Nakano"},
{name:"Nino Nakano",group:"Girls",anime:"The Quintessential Quintuplets",query:"Nino Nakano"},
{name:"Miku Nakano",group:"Girls",anime:"The Quintessential Quintuplets",query:"Miku Nakano"},
{name:"Yotsuba Nakano",group:"Girls",anime:"The Quintessential Quintuplets",query:"Yotsuba Nakano"},
{name:"Itsuki Nakano",group:"Girls",anime:"The Quintessential Quintuplets",query:"Itsuki Nakano"},
{name:"Akari Watanabe",group:"Girls",anime:"More Than a Married Couple",query:"Akari Watanabe"},
{name:"Marin Kitagawa",group:"Girls",anime:"My Dress-Up Darling",query:"Marin Kitagawa"},
{name:"Zero Two",group:"Girls",anime:"DARLING in the FRANXX",query:"Zero Two"},
{name:"Alya",group:"Girls",anime:"Alya Sometimes Hides Her Feelings in Russian",query:"Alya"},
{name:"Satoru Gojo",group:"Boys",anime:"Jujutsu Kaisen",query:"Satoru Gojo"},
{name:"Ryomen Sukuna",group:"Boys",anime:"Jujutsu Kaisen",query:"Ryomen Sukuna"},
{name:"Kakashi Hatake",group:"Boys",anime:"Naruto",query:"Kakashi Hatake"},
{name:"Might Guy",group:"Boys",anime:"Naruto",query:"Might Guy"},
{name:"Escanor",group:"Boys",anime:"The Seven Deadly Sins",query:"Escanor"},
{name:"Son Goku",group:"Boys",anime:"Dragon Ball",query:"Son Goku"},
{name:"Izuku Midoriya",group:"Boys",anime:"My Hero Academia",query:"Izuku Midoriya"},
{name:"Edward Elric",group:"Boys",anime:"Fullmetal Alchemist",query:"Edward Elric"}
];
const $=id=>document.getElementById(id);let selected=null,group="All",mode="Conversation",portraitCache={};
const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#302a3b"/><circle cx="60" cy="43" r="23" fill="#82749b"/><path d="M17 120c4-31 20-46 43-46s39 15 43 46" fill="#82749b"/></svg>');
async function getPortrait(c){if(portraitCache[c.name])return portraitCache[c.name];try{const r=await fetch('https://api.jikan.moe/v4/characters?q='+encodeURIComponent(c.query)+'&limit=5');if(!r.ok)throw Error();const d=await r.json();const exact=d.data?.find(x=>x.name?.toLowerCase()===c.name.toLowerCase())||d.data?.[0];const src=exact?.images?.jpg?.image_url||exact?.images?.webp?.image_url||fallback;portraitCache[c.name]=src;return src}catch{return fallback}}
function renderCards(){const q=$('search').value.trim().toLowerCase();const list=characters.filter(c=>(group==='All'||c.group===group)&&(!q||(c.name+' '+c.anime).toLowerCase().includes(q)));$('cards').innerHTML='';list.forEach(c=>{const card=document.createElement('button');card.className='character-card';card.innerHTML='<img alt=""><strong></strong><small></small>';card.querySelector('strong').textContent=c.name;card.querySelector('small').textContent=c.anime;card.querySelector('img').src=portraitCache[c.name]||fallback;card.onclick=()=>choose(c);$('cards').appendChild(card);getPortrait(c).then(src=>{const img=card.querySelector('img');if(img&&img.isConnected)img.src=src})});$('loading').textContent=list.length?'':'No characters found.'}
async function openPicker(){ $('picker').classList.add('open');$('search').focus();renderCards();await Promise.all(characters.map(getPortrait));renderCards();$('loading').textContent=''}
function choose(c){selected=c;$('picker').classList.remove('open');$('welcome').hidden=false;$('messages').hidden=true;$('messages').innerHTML='';$('welcomeTitle').textContent='You’re chatting with '+c.name;$('welcomeText').textContent='A new conversation has started. Say hello!';const src=portraitCache[c.name]||fallback;$('heroAvatar').src=src;$('topAvatar').src=src;$('topName').textContent=c.name;$('messageInput').disabled=false;$('sendButton').disabled=false;$('messageInput').placeholder='Message '+c.name+'…';$('messageInput').focus();addMessage('bot','Hey! I’m '+c.name+'. What would you like to talk about?')}
function addMessage(who,text){$('welcome').hidden=true;$('messages').hidden=false;const el=document.createElement('div');el.className='message '+who;el.textContent=text;if(who==='bot'){const label=document.createElement('div');label.className='speaker';label.textContent=selected?.name||'Companion';el.prepend(label)}$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight}
function reply(text){const t=text.toLowerCase();if(mode==='Study'){if(/photosynthesis/.test(t))return 'Photosynthesis is how plants convert light energy into chemical energy. In the light-dependent reactions, light energy helps make ATP and NADPH. The Calvin cycle uses those molecules to build sugars from carbon dioxide.';if(/cellular respiration|respiration/.test(t))return 'Cellular respiration breaks down glucose to make ATP. Glycolysis happens in the cytoplasm; the citric acid cycle and oxidative phosphorylation happen in the mitochondria in eukaryotic cells.';if(/osmosis/.test(t))return 'Osmosis is the net movement of water across a selectively permeable membrane from higher water concentration (lower solute concentration) toward lower water concentration (higher solute concentration).';if(/diffusion/.test(t))return 'Diffusion is the net movement of particles from an area of higher concentration to an area of lower concentration, down their concentration gradient.';return 'Let’s work through that together. Tell me what part you’re learning, and I can explain it step by step.'}if(/hello|hi|hey/.test(t))return 'Hey! What’s on your mind?';if(/who are you/.test(t))return 'I’m '+selected.name+'. We can chat, study, or just talk about whatever you’re interested in.';return 'That’s interesting. Tell me a little more — what do you think about it?'}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const value=$('messageInput').value.trim();if(!value||!selected)return;addMessage('user',value);$('messageInput').value='';$('messageInput').style.height='auto';setTimeout(()=>addMessage('bot',reply(value)),350)});
$('messageInput').addEventListener('input',()=>{$('messageInput').style.height='auto';$('messageInput').style.height=Math.min($('messageInput').scrollHeight,140)+'px'});
$('openPicker').onclick=openPicker;$('closePicker').onclick=()=>$('picker').classList.remove('open');$('picker').addEventListener('click',e=>{if(e.target===$('picker'))$('picker').classList.remove('open')});$('search').addEventListener('input',renderCards);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{group=b.dataset.group;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderCards()});
document.querySelectorAll('.mode-button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode-button').forEach(x=>x.classList.toggle('active',x===b));});
renderCards();openPicker();
</script>
</body>
</html>
